spring.datasource.url=jdbc:h2:mem:symposium
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:4000}

# actuator/metrics run on their own port, separate from the app
management.server.port=9090
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Graphite metrics export - app pushes its own metrics, no collectd needed
management.graphite.metrics.export.enabled=true
management.graphite.metrics.export.host=graphite
management.graphite.metrics.export.port=2003
management.graphite.metrics.export.protocol=plaintext
management.graphite.metrics.export.step=10s
management.metrics.tags.application=symposium
